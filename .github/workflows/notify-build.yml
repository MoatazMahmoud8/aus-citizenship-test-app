name: Notify — Ready to Build

on:
  push:
    branches:
      - dev
    paths:
      # Only notify when actual app code changes (not docs/chat history)
      - 'app/**'
      - 'assets/**'
      - 'constants/**'
      - 'data/**'
      - 'utils/**'
      - 'package.json'
      - 'app.json'
      - 'eas.json'

permissions:
  issues: write
  contents: read

jobs:
  notify:
    name: Create build prompt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get commit info
        id: info
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT

      - name: Create issue to prompt build
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.info.outputs.sha_short }}';
            const message = `${{ steps.info.outputs.message }}`;
            const author = '${{ steps.info.outputs.author }}';
            const androidUrl = `https://github.com/${{ github.repository }}/actions/workflows/eas-build.yml`;
            const iosUrl = `https://github.com/${{ github.repository }}/actions/workflows/eas-build-ios.yml`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🏗️ New code pushed — build? (${sha})`,
              body: [
                `**Commit:** \`${sha}\` — ${message}`,
                `**Author:** ${author}`,
                `**Branch:** dev`,
                '',
                '---',
                '',
                '### 👇 Ready to build?',
                '',
                `**🤖 Android:** [Run Android Build](${androidUrl})`,
                `**🍎 iOS:** [Run iOS Build](${iosUrl})`,
                '',
                '> Select profile (production / preview / development), then click **Run workflow**.',
                '',
                '_Close this issue once you\'ve decided._',
              ].join('\n'),
              labels: ['build-prompt'],
            });
