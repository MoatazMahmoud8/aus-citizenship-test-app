<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACE Splash Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000C2D;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .phone-frame {
    width: 300px;
    height: 560px;
    background: #000C2D;
    border-radius: 36px;
    border: 8px solid #1a1a2e;
    box-shadow: 0 0 60px rgba(0,43,127,0.5), 0 40px 80px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Notch */
  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 22px;
    background: #1a1a2e;
    border-radius: 0 0 14px 14px;
    z-index: 100;
  }

  /* Background glow */
  .bg-glow {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,43,127,0.5) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: pulseGlow 3s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
  }

  /* Southern Cross stars */
  .star {
    position: absolute;
    color: #FFD700;
    text-shadow: 0 0 10px rgba(255,215,0,0.9), 0 0 20px rgba(255,215,0,0.5);
    opacity: 0;
    font-size: 16px;
  }
  .star:nth-child(1) { top: 31%; left: 60%; font-size: 18px; animation: starIn 0.2s ease-out 0.05s forwards; }
  .star:nth-child(2) { top: 22%; left: 46%; font-size: 16px; animation: starIn 0.2s ease-out 0.07s forwards; }
  .star:nth-child(3) { top: 15%; left: 60%; font-size: 18px; animation: starIn 0.2s ease-out 0.09s forwards; }
  .star:nth-child(4) { top: 24%; left: 73%; font-size: 14px; animation: starIn 0.2s ease-out 0.11s forwards; }
  .star:nth-child(5) { top: 29%; left: 66%; font-size: 10px; animation: starIn 0.2s ease-out 0.13s forwards; }

  @keyframes starIn {
    from { opacity: 0; transform: scale(0.2); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Content wrapper */
  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }

  /* Compass */
  .compass {
    font-size: 72px;
    margin-bottom: 24px;
    opacity: 0;
    filter: drop-shadow(0 4px 20px rgba(255,215,0,0.4));
    animation: compassIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.05s forwards;
    transform-origin: center;
  }

  @keyframes compassIn {
    from { opacity: 0; transform: scale(0) rotate(-30deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* ACE Title */
  .title {
    font-size: 52px;
    font-weight: 900;
    color: #FFD700;
    letter-spacing: 12px;
    text-shadow: 0 2px 16px rgba(255,215,0,0.6), 0 0 40px rgba(255,215,0,0.3);
    opacity: 0;
    transform: translateY(30px);
    animation: slideUp 0.2s ease-out 0.1s forwards;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    margin: 16px 0;
    opacity: 0;
    animation: fadeIn 0.2s ease-out 0.12s forwards;
  }

  .gold-line {
    height: 1.5px;
    background: #FFD700;
    opacity: 0.7;
    width: 0;
    animation: expandLine 0.2s ease-out 0.12s forwards;
  }

  @keyframes expandLine {
    from { width: 0; }
    to   { width: 120px; }
  }

  .gold-star-divider {
    color: #FFD700;
    font-size: 14px;
    margin: 0 10px;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Subtitle */
  .subtitle {
    font-size: 15px;
    font-weight: 300;
    color: rgba(255,255,255,0.9);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 40px;
    opacity: 0;
    transform: translateY(15px);
    animation: slideUp 0.2s ease-out 0.14s forwards;
  }

  /* Badge */
  .badge {
    background: rgba(0, 132, 61, 0.3);
    border: 1px solid rgba(0, 132, 61, 0.6);
    border-radius: 20px;
    padding: 8px 20px;
    opacity: 0;
    transform: scale(0.8);
    animation: badgeIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.16s forwards;
  }

  .badge-text {
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
  }

  @keyframes badgeIn {
    from { opacity: 0; transform: scale(0.8); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Outer label */
  .outer-label {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Replay button */
  .replay-btn {
    position: fixed;
    bottom: 60px;
    right: 30px;
    background: rgba(255,215,0,0.15);
    border: 1px solid rgba(255,215,0,0.4);
    border-radius: 10px;
    padding: 10px 18px;
    color: #FFD700;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .replay-btn:hover { background: rgba(255,215,0,0.25); }

</style>
</head>
<body>

<div class="phone-frame" id="phone">
  <div class="notch"></div>
  <div class="bg-glow"></div>

  <!-- Southern Cross -->
  <span class="star">✦</span>
  <span class="star">✦</span>
  <span class="star">✦</span>
  <span class="star">✦</span>
  <span class="star">✦</span>

  <div class="content">
    <div class="compass">🧭</div>
    <div class="title">ACE</div>
    <div class="divider">
      <div class="gold-line"></div>
      <span class="gold-star-divider">★</span>
      <div class="gold-line"></div>
    </div>
    <div class="subtitle">AU Citizenship Exam</div>
    <div class="badge">
      <span class="badge-text">🦘 Exam Preparation</span>
    </div>
  </div>
</div>

<div class="outer-label">Splash Screen Preview</div>
<button class="replay-btn" onclick="replayAnimation()">↺ Replay</button>

<script>
function replayAnimation() {
  const phone = document.getElementById('phone');
  const clone = phone.cloneNode(true);
  phone.parentNode.replaceChild(clone, phone);
  clone.id = 'phone';
}
</script>

</body>
</html>
